[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingdesk"
version = "0.1.0"
description = "Algorithmic Offline Trading Desk: Market Research, Quantitative Math, and Risk Audit"
readme = "README.md"
requires-python = ">=3.14.0"
license = { text = "MIT" }
authors = [
    { name = "TradingDesk Team" }
]
dependencies = [
    "yfinance>=1.3.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[project.scripts]
tradingdesk = "tradingdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
